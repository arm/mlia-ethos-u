name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

  # Separate uv installations from each other on self-hosten runners
  # in case they share the working directory
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin-ci-${{ github.run_id }}-${{ github.run_attempt }}

  VAULT_COMMON_CI_SECRETS: &vault-common-ci-secrets |
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} VENDORED_ARTIFACTS_URLS | VENDORED_ARTIFACTS_URLS

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  build:
    name: Build
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  test_quick:
    name: Quick Tests
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --no-sources --group test
      - run: |
          set -o pipefail
          uv run pytest -m "not slow" tests/ | tee coverage.txt
      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```text'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  test_e2e:
    name: End-to-End Tests (${{ matrix.name }})
    needs: build
    # Checkout and artifact downloads require secrets unavailable to fork PRs.
    if: >-
      ${{ (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.repository_owner != 'arm' }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(vars.MLIA_E2E_TEST_CASES) }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download plugin wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: |
            ${{ env.VAULT_COMMON_CI_SECRETS }} ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_GIT_SOURCE_PASSWORD | ARTIFACT_GIT_SOURCE_PASSWORD ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_HTTP_SOURCE_TOKEN | ARTIFACT_HTTP_SOURCE_TOKEN
      - name: Install e2e system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs jq python3-dev
      - name: Run MLIA e2e tests
        id: e2e
        uses: Arm-Debug/mlia-test-runner/.github/actions/mlia-e2e@5dc9c9d000d90aa024ee563213c3b3c9f9e588f7
        with:
          wheelPath: dist/*.whl
          testCase: ${{ toJSON(matrix) }}
          pythonVersion: "3.12"
          httpSourceHost: ${{ vars.ARTIFACT_HTTP_SOURCE_HOST }}
          httpSourceAuth: ${{ vars.ARTIFACT_HTTP_SOURCE_AUTH }}
          httpSourceToken: ${{ env.ARTIFACT_HTTP_SOURCE_TOKEN }}
          packageIndexUrl: ${{ env.UV_DEFAULT_INDEX }}
          packageIndexUsername: ${{ env.UV_INDEX_INTERNAL_USERNAME }}
          packageIndexPassword: ${{ env.UV_INDEX_INTERNAL_PASSWORD }}
      - name: Upload e2e output
        if: ${{ always() && steps.e2e.outputs.logsPath != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ matrix.name }}
          path: ${{ steps.e2e.outputs.logsPath }}
          if-no-files-found: warn
