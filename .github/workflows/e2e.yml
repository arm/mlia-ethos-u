name: End-to-End Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      wheel-artifact:
        description: Existing wheel artifact from this run; leave empty to build a wheel.
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"

  # Separate uv installations from each other on self-hosted runners
  # in case they share the working directory
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-e2e-${{ github.run_id }}-${{ github.run_attempt }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-e2e-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools-e2e-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin-e2e-${{ github.run_id }}-${{ github.run_attempt }}

  VAULT_COMMON_CI_SECRETS: &vault-common-ci-secrets |
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} VENDORED_ARTIFACTS_URLS | VENDORED_ARTIFACTS_URLS

jobs:
  build:
    name: Build Wheel
    if: ${{ github.repository_owner != 'arm' && inputs.wheel-artifact == '' }}
    runs-on: ${{ fromJSON(vars.UBUNTU_RUNNER_X64) }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build --wheel
      - name: Upload built wheel
        uses: actions/upload-artifact@v4
        with:
          name: built-wheel
          path: dist/*.whl
          if-no-files-found: error

  test_e2e:
    name: End-to-End Tests (${{ matrix.test_case.name }}, ${{ matrix.runner.platform }} - ${{ matrix.runner.arch }})
    needs: build
    # A caller-provided wheel skips the build job but must still run the tests.
    if: >-
      ${{ !cancelled() && github.repository_owner != 'arm' &&
      (needs.build.result == 'success' ||
      (inputs.wheel-artifact != '' && needs.build.result == 'skipped')) }}
    runs-on: ${{ fromJSON(matrix.runner.labels) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.E2E_MAX_PARALLEL || '1') }}
      matrix:
        runner:
          - labels: ${{ vars.UBUNTU_RUNNER_X64 }}
            platform: linux
            arch: x86
          - labels: ${{ vars.UBUNTU_RUNNER_ARM64 }}
            platform: linux
            arch: ARM64
        test_case: ${{ fromJSON(vars.MLIA_E2E_TEST_CASES) }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download plugin wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wheel-artifact || 'built-wheel' }}
          path: dist
      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: |
            ${{ env.VAULT_COMMON_CI_SECRETS }} ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_GIT_SOURCE_PASSWORD | ARTIFACT_GIT_SOURCE_PASSWORD ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_HTTP_SOURCE_TOKEN | ARTIFACT_HTTP_SOURCE_TOKEN
      - name: Install e2e system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs jq python3-dev
      - name: Run MLIA e2e tests
        id: e2e
        uses: Arm-Debug/mlia-test-runner/.github/actions/mlia-e2e@5dc9c9d000d90aa024ee563213c3b3c9f9e588f7
        with:
          wheelPath: dist/*.whl
          testCase: ${{ toJSON(matrix.test_case) }}
          # The shared test runner requires Python 3.12.
          pythonVersion: "3.12"
          httpSourceHost: ${{ vars.ARTIFACT_HTTP_SOURCE_HOST }}
          httpSourceAuth: ${{ vars.ARTIFACT_HTTP_SOURCE_AUTH }}
          httpSourceToken: ${{ env.ARTIFACT_HTTP_SOURCE_TOKEN }}
          packageIndexUrl: ${{ env.UV_DEFAULT_INDEX }}
          packageIndexUsername: ${{ env.UV_INDEX_INTERNAL_USERNAME }}
          packageIndexPassword: ${{ env.UV_INDEX_INTERNAL_PASSWORD }}
      - name: Upload e2e output
        if: ${{ always() && steps.e2e.outputs.logsPath != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ matrix.test_case.name }}-${{ strategy.job-index }}
          path: ${{ steps.e2e.outputs.logsPath }}
          if-no-files-found: warn
