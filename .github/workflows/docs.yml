name: Docs

on:
  pull_request:
    paths:
      - 'README.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_call:
    inputs:
      publish:
        description: Publish documentation for the release wheel artifact
        required: false
        type: boolean
        default: false
      wheel-artifact:
        description: Name of the release workflow wheel artifact
        required: false
        type: string
        default: wheel
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'

  # Separate uv installations from each other on self-hosten runners
  # in case they share the working directory
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin-ci-${{ github.run_id }}-${{ github.run_attempt }}

  VAULT_COMMON_CI_SECRETS: &vault-common-ci-secrets |
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} VENDORED_ARTIFACTS_URLS | VENDORED_ARTIFACTS_URLS ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} MLIA_DOCS_ARTIFACTORY_URL | MLIA_DOCS_ARTIFACTORY_URL

jobs:
  build-docs:
    name: Build docs
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-24.04-arm' }}
    steps:
      - name: Import secrets from Vault
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --no-sources --no-install-project --only-group docs
      - run: uv run --no-sync mkdocs build --strict --no-directory-urls
      - name: Upload docs artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-site-mlia-ethos-u
          path: .mkdocs/site/
          if-no-files-found: error
      - name: Download release wheel
        if: inputs.publish
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wheel-artifact }}
          path: release-wheel
      - name: Read release metadata
        id: release-metadata
        if: inputs.publish
        shell: python
        run: |
          import os
          import re
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("release-wheel").glob("*.whl"))
          if len(wheels) != 1:
              raise ValueError(f"Expected exactly one release wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as wheel:
              metadata_paths = [name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_paths) != 1:
                  raise ValueError("Expected exactly one wheel METADATA file")
              metadata = BytesParser().parsebytes(wheel.read(metadata_paths[0]), headersonly=True)
          name = metadata.get("Name", "")
          version = metadata.get("Version", "")
          component = re.sub(r"[-_.]+", "-", name.lower())
          if not component or not version:
              raise ValueError("Release wheel metadata does not define Name and Version")
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise ValueError(f"Tag does not match wheel version {version}")
          if ".dev" in version or "+" in version:
              raise ValueError("Development and local versions are unsupported")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"component={component}\nversion={version}\n")
      - name: Publish versioned documentation
        if: inputs.publish
        uses: Arm-Debug/github-workflow-wizardry/.github/actions/publish-versioned-docs@7549a2dfbaa47ea0e48685de0f152a3bc2fa7896
        with:
          site-path: .mkdocs/site
          component: ${{ steps.release-metadata.outputs.component }}
          version: ${{ steps.release-metadata.outputs.version }}
          repository-url: ${{ env.MLIA_DOCS_ARTIFACTORY_URL }}
          username: ${{ env.UV_INDEX_INTERNAL_USERNAME }}
          password: ${{ env.UV_INDEX_INTERNAL_PASSWORD }}
          source-repository: ${{ github.repository }}
          source-ref: ${{ github.ref_name }}
          source-commit: ${{ github.sha }}
          format: mkdocs-offline
