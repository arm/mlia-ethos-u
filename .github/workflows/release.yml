name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  ARTIFACTS_PATH: downloaded_artifacts

  # Separate uv installations from each other on self-hosten runners
  # in case they share the working directory
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin-ci-${{ github.run_id }}-${{ github.run_attempt }}

  VAULT_COMMON_CI_SECRETS: &vault-common-ci-secrets |
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} VENDORED_ARTIFACTS_URLS | VENDORED_ARTIFACTS_URLS

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  blackduck_scan:
    name: Black Duck Scan
    if: >-
      ${{ github.event.repository.private &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    uses: Arm-Debug/github-workflow-wizardry/.github/workflows/blackduck-full-scan.yml@24b734441123e62c1bb8fe180bf17efc0dec1d31
    with:
      project-version: ${{ github.ref_name }}
      source-ref: ${{ github.sha }}
    secrets:
      BLACKDUCK_API_TOKEN: ${{ secrets.BLACKDUCK_API_TOKEN }}

  build_and_test_wheel:
    name: Build And Test Wheel
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build
      - run: uv sync --no-sources --no-install-project --only-group test
      - run: |
          set -o pipefail
          uv run --no-sync \
            --with dist/*.whl \
            -- pytest tests/ | tee coverage.txt
      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```text'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload built wheel
        uses: actions/upload-artifact@v4
        with:
          name: built-wheel
          path: dist/*

  test_e2e:
    name: End-to-End Tests (${{ matrix.suite }}, Shard ${{ matrix.display_index }}/${{ matrix.total }})
    if: ${{ github.repository_owner != 'arm' }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    needs:
      - build_and_test_wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: tflite
            index: 0
            display_index: 1
            total: 4
            artifacts: ${{ vars.MLIA_E2E_ARTIFACTS }}
            backends: ${{ vars.MLIA_E2E_BACKENDS }}
            executions: ${{ vars.MLIA_E2E_EXECUTIONS }}
            converter_package: ""
            run_api_e2e: true
          - suite: tflite
            index: 1
            display_index: 2
            total: 4
            artifacts: ${{ vars.MLIA_E2E_ARTIFACTS }}
            backends: ${{ vars.MLIA_E2E_BACKENDS }}
            executions: ${{ vars.MLIA_E2E_EXECUTIONS }}
            converter_package: ""
            run_api_e2e: false
          - suite: tflite
            index: 2
            display_index: 3
            total: 4
            artifacts: ${{ vars.MLIA_E2E_ARTIFACTS }}
            backends: ${{ vars.MLIA_E2E_BACKENDS }}
            executions: ${{ vars.MLIA_E2E_EXECUTIONS }}
            converter_package: ""
            run_api_e2e: false
          - suite: tflite
            index: 3
            display_index: 4
            total: 4
            artifacts: ${{ vars.MLIA_E2E_ARTIFACTS }}
            backends: ${{ vars.MLIA_E2E_BACKENDS }}
            executions: ${{ vars.MLIA_E2E_EXECUTIONS }}
            converter_package: ""
            run_api_e2e: false
          - suite: pytorch
            index: 0
            display_index: 1
            total: 1
            artifacts: ${{ vars.MLIA_E2E_PYTORCH_ARTIFACTS }}
            backends: ${{ vars.MLIA_E2E_PYTORCH_BACKENDS }}
            executions: ${{ vars.MLIA_E2E_PYTORCH_EXECUTIONS }}
            converter_package: "mlia-converters-pytorch>=0.1.1.dev8,<0.2"
            run_api_e2e: false
    steps:
      - name: Import secrets from Vault
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: ${{ env.VAULT_COMMON_CI_SECRETS }} ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_HTTP_SOURCE_TOKEN | ARTIFACT_HTTP_SOURCE_TOKEN

      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: built-wheel
          path: dist
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate e2e configuration
        env:
          E2E_ARTIFACTS_CONFIG: ${{ matrix.artifacts }}
          E2E_BACKENDS_CONFIG: ${{ matrix.backends }}
          E2E_EXECUTIONS_CONFIG: ${{ matrix.executions }}
        run: |
          if [[ -z "$E2E_ARTIFACTS_CONFIG" ]]; then
            echo "E2E artifact configuration is empty for the ${{ matrix.suite }} suite."
            exit 1
          fi
          if [[ -z "$E2E_BACKENDS_CONFIG" ]]; then
            echo "E2E backend configuration is empty for the ${{ matrix.suite }} suite."
            exit 1
          fi
          if [[ -z "$E2E_EXECUTIONS_CONFIG" ]]; then
            echo "E2E execution configuration is empty for the ${{ matrix.suite }} suite."
            exit 1
          fi
      - name: Prepare artifacts
        uses: Arm-Debug/github-workflow-wizardry/.github/actions/prepare-artifacts@main
        env:
          ARTIFACT_HTTP_SOURCE_HOST: ${{ vars.ARTIFACT_HTTP_SOURCE_HOST }}
          ARTIFACT_HTTP_SOURCE_AUTH: ${{ vars.ARTIFACT_HTTP_SOURCE_AUTH }}
        with:
          artifacts: ${{ matrix.artifacts }}
          destination: ${{ env.ARTIFACTS_PATH }}
      - run: uv sync --no-sources --no-install-project --only-group test
      # Ensure pip is available because mlia-backend install shells out to python -m pip for backend dependencies.
      - run: ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python -m ensurepip --upgrade
      - name: Run e2e pytest
        env:
          CONVERTER_PACKAGE: ${{ matrix.converter_package }}
          MLIA_E2E_ARTIFACTS: ${{ env.ARTIFACTS_PATH }}
          MLIA_E2E_BACKENDS: ${{ matrix.backends }}
          MLIA_E2E_EXECUTIONS: ${{ matrix.executions }}
          MLIA_E2E_SHARD_INDEX: ${{ matrix.index }}
          MLIA_E2E_SHARD_COUNT: ${{ matrix.total }}
        run: |
          mkdir -p report
          rm -f "report/report-${{ matrix.suite }}-${{ matrix.index }}.xml"
          rm -rf "report/pdf-${{ matrix.suite }}-${{ matrix.index }}"
          converter_args=()
          if [[ -n "$CONVERTER_PACKAGE" ]]; then
            converter_args=(--with "$CONVERTER_PACKAGE")
          fi
          set -o pipefail
          uv run --no-sync \
            --with dist/*.whl \
            "${converter_args[@]}" \
            -- pytest -v tests/test_e2e.py \
              -x \
              -s \
              --capture=tee-sys \
              -o junit_logging=out-err \
              -o junit_log_passing_tests=true \
              --no-cov \
              --junitxml="report/report-${{ matrix.suite }}-${{ matrix.index }}.xml"
      - name: Run API e2e pytest
        if: ${{ matrix.run_api_e2e }}
        env:
          MLIA_E2E_ARTIFACTS: ${{ env.ARTIFACTS_PATH }}
          MLIA_E2E_BACKENDS: ${{ matrix.backends }}
        run: |
          set -o pipefail
          uv run --no-sync \
            --with dist/*.whl \
            -- pytest -v tests/test_e2e_api.py \
              -x \
              -s \
              --capture=tee-sys \
              -o junit_logging=out-err \
              -o junit_log_passing_tests=true \
              --no-cov \
              --junitxml="report/api-report-${{ matrix.suite }}-${{ matrix.index }}.xml"
      - name: Upload e2e junit
        if: >-
          ${{
            always() &&
            (
              hashFiles(format('report/report-{0}-{1}.xml', matrix.suite, matrix.index)) != '' ||
              hashFiles(format('report/api-report-{0}-{1}.xml', matrix.suite, matrix.index)) != ''
            )
          }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-shard-${{ matrix.suite }}-${{ matrix.index }}
          path: report/*.xml

  combine_e2e_pdf:
    name: Combine E2E PDF Reports
    if: ${{ always() && github.repository_owner != 'arm' }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    needs:
      - test_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download shard junit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-junit-shard-*
          path: report/junit
          merge-multiple: true
      - name: Convert combined JUnit to PDF
        if: ${{ hashFiles('report/junit/*.xml') != '' }}
        uses: Arm-Debug/github-workflow-wizardry/.github/actions/junit-to-pdf@main
        with:
          report-path: report/junit
          output-dir: report/pdf-combined
      - name: Upload combined e2e pdf
        if: ${{ hashFiles('report/pdf-combined/*.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pdf
          path: report/pdf-combined

  publish_release:
    name: Publish Release
    if: >-
      ${{
        !cancelled() &&
        needs.lint.result == 'success' &&
        needs.build_and_test_wheel.result == 'success' &&
        (!github.event.repository.private || github.ref_type != 'tag' ||
          needs.blackduck_scan.result == 'success') &&
        (github.repository_owner != 'arm' || github.ref_type == 'tag') &&
        (github.repository_owner == 'arm' || needs.test_e2e.result == 'success')
      }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    needs:
      - lint
      - blackduck_scan
      - build_and_test_wheel
      - test_e2e
    steps:
      - name: Import secrets from Vault
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: ${{ env.VAULT_COMMON_CI_SECRETS }} ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_HOST | UV_PUBLISH_URL ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_USERNAME | UV_PUBLISH_USERNAME ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_PASSWORD | UV_PUBLISH_PASSWORD

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: built-wheel
          path: dist
      - run: uv publish dist/*

  publish_docs:
    name: Publish Documentation
    if: ${{ github.event.repository.private && github.ref_type == 'tag' }}
    needs: publish_release
    uses: ./.github/workflows/docs.yml
    with:
      publish: true
      wheel-artifact: built-wheel
    secrets: inherit

  create_github_release:
    name: Prepare Release Notes
    if: ${{ github.event.repository.private && github.ref_type == 'tag' }}
    needs: publish_docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release or preserve existing notes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const repo = context.repo;
            const tag = process.env.RELEASE_TAG;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                ...repo, tag
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                generate_release_notes: true,
                prerelease: !/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)
              });
              return;
            }
            const updates = {};
            if (!release.body?.trim()) {
              const { data: notes } = await github.rest.repos.generateReleaseNotes({
                ...repo, tag_name: tag, target_commitish: context.sha
              });
              updates.body = notes.body;
            }
            if (release.draft) updates.draft = false;
            if (Object.keys(updates).length) {
              await github.rest.repos.updateRelease({
                ...repo, release_id: release.id, ...updates
              });
            }

  sync_to_public_repo:
    needs: [publish_release, blackduck_scan]
    if: >-
      ${{ !cancelled() && needs.publish_release.result == 'success' &&
      needs.blackduck_scan.result == 'success' &&
      github.event.repository.private && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' }}
    uses: Arm-Debug/github-workflow-wizardry/.github/workflows/sync-to-public-repo.yml@c57b3276d78f9a98175551802d7f6e87c9c94816
    with:
      public_repo: arm/mlia-ethos-u
    secrets: inherit

  sync_release_to_public_repo:
    needs: [create_github_release, blackduck_scan]
    if: >-
      ${{ !cancelled() && needs.create_github_release.result == 'success' &&
      needs.blackduck_scan.result == 'success' &&
      github.event.repository.private && github.event_name == 'push' &&
      github.ref_type == 'tag' }}
    uses: Arm-Debug/github-workflow-wizardry/.github/workflows/sync-to-public-repo.yml@c57b3276d78f9a98175551802d7f6e87c9c94816
    with:
      public_repo: arm/mlia-ethos-u
    secrets: inherit
